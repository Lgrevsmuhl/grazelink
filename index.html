<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GrazeLink</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f1e8;
    color: #263326;
}

.app {
    max-width: 700px;
    margin: auto;
    min-height: 100vh;
}

header {
    background: #304b32;
    color: white;
    padding: 24px 20px;
}

header h1 {
    margin: 0;
    font-size: 28px;
}

header p {
    margin: 5px 0 0;
    opacity: .8;
}

nav {
    display: flex;
    background: white;
    border-bottom: 1px solid #ddd;
}

nav button {
    flex: 1;
    border: 0;
    background: white;
    padding: 15px 5px;
    font-size: 14px;
    cursor: pointer;
}

nav button.active {
    color: #304b32;
    font-weight: bold;
    border-bottom: 3px solid #304b32;
}

main {
    padding: 18px;
}

.page { display: none; }
.page.active { display: block; }

.stats {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
}

.card {
    background: white;
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,.06);
}

.stat-number {
    font-size: 30px;
    font-weight: bold;
}

.stat-label {
    color: #777;
    margin-top: 4px;
}

h2 {
    margin-top: 5px;
}

button.primary {
    width: 100%;
    padding: 14px;
    background: #304b32;
    color: white;
    border: 0;
    border-radius: 10px;
    font-size: 16px;
    cursor: pointer;
}

button.secondary {
    padding: 10px 14px;
    background: #eee;
    border: 0;
    border-radius: 8px;
    cursor: pointer;
}

.animal {
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
}

.animal strong {
    font-size: 18px;
}

.tag {
    color: #777;
    font-size: 14px;
}

label {
    display: block;
    margin-top: 12px;
    font-weight: bold;
}

input, select {
    width: 100%;
    padding: 12px;
    margin-top: 5px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
}

.form-buttons {
    margin-top: 18px;
}

.back {
    margin-bottom: 15px;
}

.detail-row {
    padding: 10px 0;
    border-bottom: 1px solid #eee;
}

.detail-row span {
    color: #777;
}

.adg {
    font-size: 25px;
    font-weight: bold;
}

.empty {
    text-align: center;
    color: #777;
    padding: 25px;
}

@media (min-width: 600px) {
    .stats {
        grid-template-columns: repeat(4, 1fr);
    }
}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2></script>
</head>

<body>

<div class="app">

<header>
    <h1>🐄 GrazeLink</h1>
    <p>Australian cattle management</p>
</header>

<nav>
    <button class="nav-btn active" data-page="dashboard">Home</button>
    <button class="nav-btn" data-page="cattle">Cattle</button>
    <button class="nav-btn" data-page="breeding">Breeding</button>
    <button class="nav-btn" data-page="records">Records</button>
</nav>

<main>

<!-- DASHBOARD -->
<section id="dashboard" class="page active">

    <h2>Good morning 👋</h2>

    <div class="stats">
        <div class="card">
            <div class="stat-number" id="totalCattle">0</div>
            <div class="stat-label">Total cattle</div>
        </div>

        <div class="card">
            <div class="stat-number" id="totalCows">0</div>
            <div class="stat-label">Breeders</div>
        </div>

        <div class="card">
            <div class="stat-number" id="totalBulls">0</div>
            <div class="stat-label">Bulls</div>
        </div>

        <div class="card">
            <div class="stat-number" id="totalCalves">0</div>
            <div class="stat-label">Calves</div>
        </div>
    </div>

    <div class="card">
        <h3>Quick actions</h3>

        <button class="primary" id="addAnimalButton">
            + Add cattle
        </button>
    </div>

    <div class="card">
        <h3>Recent cattle</h3>
        <div id="recentAnimals"></div>
    </div>

</section>


<!-- CATTLE -->
<section id="cattle" class="page">

    <h2>Your cattle</h2>

    <button class="primary" id="addAnimalButton2">
        + Add animal
    </button>

    <br><br>

    <div id="animalList"></div>

</section>


<!-- ADD ANIMAL -->
<section id="addAnimal" class="page">

    <button class="secondary back" id="backToCattle">
        ← Back
    </button>

    <div class="card">

        <h2>Add animal</h2>

        <label>Tag / NLIS number</label>
        <input id="animalTag" placeholder="e.g. DS025">

        <label>Sex</label>
        <select id="animalSex">
            <option value="Cow">Cow</option>
            <option value="Bull">Bull</option>
            <option value="Heifer">Heifer</option>
            <option value="Steer">Steer</option>
            <option value="Calf">Calf</option>
        </select>

        <label>Breed</label>
        <input id="animalBreed" placeholder="e.g. Droughtmaster x Senepol">

        <label>Date of birth</label>
        <input id="animalDob" type="date">

        <label>Dam (mother)</label>
        <select id="animalDam">
            <option value="">Unknown / not recorded</option>
        </select>

        <label>Sire (father)</label>
        <select id="animalSire">
            <option value="">Unknown / not recorded</option>
        </select>

        <label>Current paddock</label>
        <input id="animalPaddock" placeholder="e.g. Front">

        <label>Birth weight (kg)</label>
        <input id="animalBirthWeight" type="number" step="0.1" placeholder="e.g. 38">

        <div class="form-buttons">
            <button class="primary" id="saveAnimal">
                Save animal
            </button>
        </div>

    </div>

</section>


<!-- ANIMAL DETAIL -->
<section id="animalDetail" class="page">

    <button class="secondary back" id="backFromDetail">
        ← Back
    </button>

    <div id="animalDetailContent"></div>

</section>


<!-- BREEDING -->
<section id="breeding" class="page">

    <h2>🧬 Breeding & genetics</h2>

    <div class="card">
        <h3>Family records</h3>
        <p>
            GrazeLink links each calf to its dam and sire,
            allowing you to follow genetics through generations.
        </p>
    </div>

    <div class="card">
        <h3>What we'll add next</h3>
        <div class="detail-row">🐮 Joining records</div>
        <div class="detail-row">🤰 Pregnancy testing</div>
        <div class="detail-row">🍼 Calving records</div>
        <div class="detail-row">🧬 Family trees</div>
        <div class="detail-row">📊 Sire performance</div>
        <div class="detail-row">📈 Dam performance</div>
    </div>

</section>


<!-- RECORDS -->
<section id="records" class="page">

    <h2>Records</h2>

    <div class="card">
        <h3>⚖️ Weights & ADG</h3>
        <p>
            Weight records and automatic Average Daily Gain
            calculations will live here.
        </p>
    </div>

    <div class="card">
        <h3>💉 Health</h3>
        <p>Treatments, vaccinations and drenching records.</p>
    </div>

    <div class="card">
        <h3>📍 Movements</h3>
        <p>Paddock and mob movements.</p>
    </div>

    <div class="card">
        <h3>💰 Sales</h3>
        <p>Sale weights, prices, costs and performance.</p>
    </div>

</section>

</main>
</div>


<script>

let cattle = JSON.parse(localStorage.getItem("grazelinkCattle") || "[]");

function saveData() {
    localStorage.setItem("grazelinkCattle", JSON.stringify(cattle));
}

function showPage(pageId) {

    document.querySelectorAll(".page").forEach(page => {
        page.classList.remove("active");
    });

    document.getElementById(pageId).classList.add("active");

    document.querySelectorAll(".nav-btn").forEach(button => {
        button.classList.remove("active");

        if (button.dataset.page === pageId) {
            button.classList.add("active");
        }
    });

    updateDashboard();
    renderAnimals();
}

document.querySelectorAll(".nav-btn").forEach(button => {
    button.addEventListener("click", () => {
        showPage(button.dataset.page);
    });
});


function updateDashboard() {

    document.getElementById("totalCattle").textContent = cattle.length;

    document.getElementById("totalCows").textContent =
        cattle.filter(a => a.sex === "Cow").length;

    document.getElementById("totalBulls").textContent =
        cattle.filter(a => a.sex === "Bull").length;

    document.getElementById("totalCalves").textContent =
        cattle.filter(a =>
            a.sex === "Calf" ||
            a.sex === "Heifer" ||
            a.sex === "Steer"
        ).length;

    const recent = document.getElementById("recentAnimals");

    if (cattle.length === 0) {
        recent.innerHTML =
            '<div class="empty">No cattle entered yet.</div>';
        return;
    }

    recent.innerHTML = cattle.slice(-5).reverse().map(a => `
        <div class="animal card" onclick="openAnimal('${a.id}')">
            <div>
                <strong>${a.tag}</strong>
                <div class="tag">${a.sex} · ${a.breed || "Breed not recorded"}</div>
            </div>
            <div>›</div>
        </div>
    `).join("");
}


function renderAnimals() {

    const list = document.getElementById("animalList");

    if (cattle.length === 0) {
        list.innerHTML =
            '<div class="card empty">No cattle yet.<br><br>Add your first animal above.</div>';
        return;
    }

    list.innerHTML = cattle.map(a => `
        <div class="animal card" onclick="openAnimal('${a.id}')">
            <div>
                <strong>${a.tag}</strong>
                <div class="tag">
                    ${a.sex} · ${a.breed || "Breed not recorded"}
                </div>
            </div>
            <div>›</div>
        </div>
    `).join("");
}


function populateParents() {

    const dam = document.getElementById("animalDam");
    const sire = document.getElementById("animalSire");

    dam.innerHTML =
        '<option value="">Unknown / not recorded</option>';

    sire.innerHTML =
        '<option value="">Unknown / not recorded</option>';

    cattle.forEach(a => {

        if (a.sex === "Cow" || a.sex === "Heifer") {
            dam.innerHTML +=
                `<option value="${a.id}">${a.tag}</option>`;
        }

        if (a.sex === "Bull") {
            sire.innerHTML +=
                `<option value="${a.id}">${a.tag}</option>`;
        }

    });
}


function openAddAnimal() {

    populateParents();

    document.getElementById("animalTag").value = "";
    document.getElementById("animalBreed").value = "";
    document.getElementById("animalDob").value = "";
    document.getElementById("animalPaddock").value = "";
    document.getElementById("animalBirthWeight").value = "";

    showPage("addAnimal");
}


document.getElementById("addAnimalButton")
    .addEventListener("click", openAddAnimal);

document.getElementById("addAnimalButton2")
    .addEventListener("click", openAddAnimal);


document.getElementById("backToCattle")
    .addEventListener("click", () => showPage("cattle"));


document.getElementById("backFromDetail")
    .addEventListener("click", () => showPage("cattle"));


document.getElementById("saveAnimal")
    .addEventListener("click", () => {

        const tag =
            document.getElementById("animalTag").value.trim();

        if (!tag) {
            alert("Please enter a tag or NLIS number.");
            return;
        }

        const animal = {

            id: Date.now().toString(),

            tag: tag,

            sex:
                document.getElementById("animalSex").value,

            breed:
                document.getElementById("animalBreed").value.trim(),

            dob:
                document.getElementById("animalDob").value,

            dam:
                document.getElementById("animalDam").value,

            sire:
                document.getElementById("animalSire").value,

            paddock:
                document.getElementById("animalPaddock").value.trim(),

            birthWeight:
                Number(document.getElementById("animalBirthWeight").value) || null,

            weights: []

        };

        cattle.push(animal);

        saveData();

        showPage("cattle");

    });


function findAnimal(id) {
    return cattle.find(a => a.id === id);
}


function parentName(id) {

    if (!id) return "Not recorded";

    const parent = findAnimal(id);

    return parent ? parent.tag : "Unknown";

}


function openAnimal(id) {

    const animal = findAnimal(id);

    if (!animal) return;

    const offspring = cattle.filter(a =>
        a.dam === animal.id ||
        a.sire === animal.id
    );

    let adgText = "No weight records yet.";

    if (animal.weights.length >= 2) {

        const first = animal.weights[0];
        const last =
            animal.weights[animal.weights.length - 1];

        const days =
            (new Date(last.date) - new Date(first.date))
            / (1000 * 60 * 60 * 24);

        if (days > 0) {

            const gain =
                Number(last.weight) - Number(first.weight);

            const adg =
                gain / days;

            adgText =
                `<div class="adg">${adg.toFixed(2)} kg/day</div>
                 Overall ADG`;

        }

    }

    document.getElementById("animalDetailContent").innerHTML = `

        <div class="card">

            <h2>🐄 ${animal.tag}</h2>

            <div class="detail-row">
                <span>Sex</span><br>
                ${animal.sex}
            </div>

            <div class="detail-row">
                <span>Breed</span><br>
                ${animal.breed || "Not recorded"}
            </div>

            <div class="detail-row">
                <span>Date of birth</span><br>
                ${animal.dob || "Not recorded"}
            </div>

            <div class="detail-row">
                <span>Paddock</span><br>
                ${animal.paddock || "Not recorded"}
            </div>

        </div>


        <div class="card">

            <h3>🧬 Genetics</h3>

            <div class="detail-row">
                <span>Dam</span><br>
                ${parentName(animal.dam)}
            </div>

            <div class="detail-row">
                <span>Sire</span><br>
                ${parentName(animal.sire)}
            </div>

            <h4>Offspring</h4>

            ${
                offspring.length
                ? offspring.map(o =>
                    `<div class="detail-row">
                        ${o.tag} · ${o.sex}
                    </div>`
                ).join("")
                : '<div class="tag">No offspring recorded.</div>'
            }

        </div>


        <div class="card">

            <h3>⚖️ Weights & ADG</h3>

            <div class="detail-row">
                Birth weight:
                <strong>
                    ${animal.birthWeight
                        ? animal.birthWeight + " kg"
                        : "Not recorded"}
                </strong>
            </div>

            <div class="detail-row">
                ${adgText}
            </div>

        </div>

    `;

    showPage("animalDetail");
}


updateDashboard();
renderAnimals();
    

</script>

</body>
</html>
